[build]
  # `nuxt build` (not `generate`) so Nitro deploys server endpoints
  # (server/api/*) as Netlify Functions. Static pages listed in
  # nuxt.config.ts → nitro.prerender.routes are still pre-rendered.
  # Hybrid model: fast static pages + working API routes.
  #
  # Output structure (with NITRO_PRESET=netlify):
  #   - dist/                              ← static assets (publish dir)
  #   - .netlify/functions-internal/server ← serverless function (auto-discovered)
  command = "npm run build"
  publish = "dist"

# Tells Bing / DuckDuckGo about every sitemap URL once a production deploy is
# live. See netlify/plugins/indexnow/index.js.
[[plugins]]
  package = "./netlify/plugins/indexnow"

[build.environment]
  NODE_VERSION = "20"
  # Force the Netlify preset explicitly. Nitro normally auto-detects via
  # NETLIFY=true, but we set it here defensively so the build can never
  # silently fall back to the generic Node preset (which would skip the
  # functions wiring).
  NITRO_PRESET = "netlify"

# PostHog reverse proxy. Routes /relay-Bn3Q/* through our own domain so
# adblockers (uBlock Origin, Brave Shields, Firefox Strict, NextDNS, etc.)
# don't filter analytics traffic the way they do for *.posthog.com.
# PostHog's recommended pattern; the random-looking suffix in the path
# makes it harder for filter lists to target a generic /relay-* rule.
# Static assets and the API are on different PostHog subdomains, hence
# two rules. force=true ensures the rewrite always fires regardless of
# whether a static file exists at the path.
#
# IMPORTANT: these MUST come before the /* → function catch-all below,
# otherwise Netlify routes the proxy paths into the Nitro function.
[[redirects]]
  from = "/relay-Bn3Q/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/relay-Bn3Q/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true

# Canonical host. The site answers on three hostnames — the apex, the `www`
# alias and the Netlify deploy domain — and all three used to serve 200, so
# the same content was crawlable three times and the ranking signals split
# between them. That is one of the few explanations that fits the site being
# effectively absent from Google (6 visitors in five months) while Bing
# indexes it normally and sends 124.
#
# Same ordering constraint as the proxy rules above: these MUST come before
# the /* → function catch-all. Netlify evaluates redirects top to bottom and
# the first match wins, so a `/*` placed earlier shadows every host rule
# after it and none of them ever fire. `force = true` is also required, or
# the prerendered HTML on the CDN is served before redirects are consulted.
[[redirects]]
  from = "https://www.s3explorer.accessdevops.com/*"
  to = "https://s3explorer.accessdevops.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://s3explorer.netlify.app/*"
  to = "https://s3explorer.accessdevops.com/:splat"
  status = 301
  force = true

# Only these three surfaces still need the Nitro function: the release feed,
# the Lemon Squeezy webhook, and the sitemap (generated at request time by
# @nuxtjs/sitemap). Every page is prerendered and served from the CDN.
#
# This used to be a `/*` catch-all, which meant every unknown URL was handed
# to the function — and rendering the error page there fails, so the site
# answered 500 instead of 404 on any typo. A 500 tells a crawler to retry
# later and keeps the URL in its queue; a 404 retires it. With the catch-all
# narrowed, Netlify falls back to the prerendered 404.html instead.
#
# If a new server route is ever added under a different path, it needs a rule
# here or it will 404.
# Unknown provider ids must answer 404, not 500. /providers/:id is the only
# dynamic route on the site, and something in the Netlify/Nitro integration
# routes it to the function even though every valid id is prerendered — the
# function then fails to render the error page. This rule is not forced, so
# Netlify still serves the prerendered HTML for the ten real guides and only
# falls through to 404.html for the rest.
[[redirects]]
  from = "/providers/*"
  to = "/404.html"
  status = 404

# Same for /guides/:slug — every guide and /guides/rss.xml are prerendered,
# so only unknown slugs fall through to this unforced rule.
[[redirects]]
  from = "/guides/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/__sitemap__/*"
  to = "/.netlify/functions/server"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
